<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 705" width="100%" height="100%">
  <defs>
    <linearGradient id="atyabGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="30%" stop-color="#B88A28"/>
      <stop offset="70%" stop-color="#C59B3F"/>
      <stop offset="100%" stop-color="#9E7422"/>
    </linearGradient>
    <style>
      .gold-elem { fill: url(#atyabGoldGrad); }
      .gold-stroke { stroke: url(#atyabGoldGrad); fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .brand-title-en {
        font-family: 'Times New Roman', 'Amiri', 'Cinzel', serif;
        font-size: 80px;
        font-weight: 800;
        letter-spacing: 0.30em;
        fill: url(#atyabGoldGrad);
        text-anchor: middle;
      }
      .brand-sub-en {
        font-family: 'Times New Roman', 'Amiri', 'Cinzel', serif;
        font-size: 38px;
        font-weight: 700;
        letter-spacing: 0.36em;
        fill: url(#atyabGoldGrad);
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- ===================================================================
       ATYAB ROYAL CALLIGRAPHIC CREST / MONOGRAM (أطـيـاب للعـطـور)
       Symmetrical Arabesque Heraldic Insignia in Ahmed Al Maghribi Luxury Style
       =================================================================== -->
  <g class="gold-elem" transform="translate(350, 275)">
    <!-- Central Symmetrical Crown / Finial (Alif Tops) -->
    <path d="M0, -210 C14,-190 28,-160 28,-130 C28,-100 16,-85 0,-70 C-16,-85 -28,-100 -28,-130 C-28,-160 -14,-190 0,-210 Z" />
    <circle cx="0" cy="-228" r="8" />

