<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    (function() {
      var sp = new URLSearchParams(window.location.search);
      var qLang = sp.get('lang');
      var sLang = localStorage.getItem('atyab_language') || localStorage.getItem('aytyab_language');
      var lang = (qLang === 'ar' || qLang === 'en') ? qLang : (sLang || 'ar');
      var target = 'perfumes.html?cat=bakhoor' + (lang === 'en' ? '&lang=en' : '');
      window.location.replace(target);
    })();
  </script>
  <title>Redirecting to Bakhoor & Incense...</title>
</head>
<body></body>
</html>
